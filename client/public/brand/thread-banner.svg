  <text x="800" y="650" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#3a2c08">PLAY  ›  PLAYMAREA.COM</text>

  <text x="800" y="712" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" letter-spacing="3" fill="#dfe9d8" opacity=".92">X @playmarea  ·  t.me/playmarea  ·  $RIV CA: COMING SOON</text>
