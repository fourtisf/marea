    <g><rect x="715" y="540" width="150" height="44" rx="22" fill="rgba(231,196,107,.16)" stroke="url(#tgold)" stroke-width="1"/><text x="790" y="568" fill="#ffeec2">ON SOLANA</text></g>
    <g><rect x="880" y="540" width="120" height="44" rx="22" fill="rgba(231,196,107,.16)" stroke="url(#tgold)" stroke-width="1"/><text x="940" y="568" fill="#ffeec2">$RIV</text></g>
