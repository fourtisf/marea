    <g transform="translate(300,540)"><rect x="-14" y="0" width="28" height="36"/><path d="M-20 0 L0 -20 L20 0 Z"/></g>
    <g transform="translate(1340,540)"><rect x="-16" y="0" width="32" height="40"/><path d="M-22 0 L0 -22 L22 0 Z"/></g>
  </g>
  <rect y="572" width="1600" height="328" fill="url(#tsea)"/>
  <rect x="1095" y="572" width="150" height="328" fill="#ffe5a6" opacity=".24"/>
  <g stroke="#dffaff" stroke-width="3" fill="none" opacity=".45" stroke-linecap="round">
    <path d="M120 680 q40 -12 80 0 t80 0 t80 0"/><path d="M1180 760 q40 -12 80 0 t80 0"/>
  </g>
  <g fill="#0f2930">
    <g transform="translate(560,648)"><path d="M-52 8 L52 8 L40 28 L-42 28 Z"/><rect x="-22" y="-8" width="44" height="16" rx="2"/><rect x="-2" y="-34" width="3" height="26"/></g>
    <g transform="translate(1320,800) scale(.7)"><path d="M-52 8 L52 8 L40 28 L-42 28 Z"/><rect x="-22" y="-8" width="44" height="16" rx="2"/></g>
  </g>

  <!-- centered glass panel -->
  <rect x="360" y="150" width="880" height="600" rx="34" fill="rgba(13,34,40,0.66)" stroke="url(#tgold)" stroke-width="1.5"/>

  <!-- monogram -->
  <g transform="translate(800,232) scale(0.62) translate(-128,-128)">
    <circle cx="128" cy="78" r="23" fill="url(#tmsun)"/>
    <path d="M76 178 L76 104 L128 146 L180 104 L180 178" fill="none" stroke="url(#tgold)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M84 196 q11 -7 22 0 t22 0 t22 0 t22 0" fill="none" stroke="url(#tgold)" stroke-width="4" stroke-linecap="round" opacity=".9"/>
  </g>

  <text x="800" y="360" text-anchor="middle" font-size="92" letter-spacing="22" font-weight="600" fill="#fff7e6">MAREA</text>
  <text x="800" y="398" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" letter-spacing="7" fill="#e7c46b">A LUXURY HARBOR AT GOLDEN HOUR</text>

  <!-- hook -->
  <text x="800" y="466" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="23" fill="#f3ead2">Walk a shared harbor. Work the marina.</text>
  <text x="800" y="500" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="23" fill="#f3ead2">Rise to boats, berths &amp; a villa the whole quay can see.</text>

