<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="tsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9ad"/><stop offset=".4" stop-color="#f7c75d"/>
      <stop offset=".66" stop-color="#ef9f4c"/><stop offset="1" stop-color="#dd8050"/>
    </linearGradient>
    <linearGradient id="tsea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39b2c8"/><stop offset="1" stop-color="#19809a"/>
    </linearGradient>
    <radialGradient id="tsun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff5d4"/><stop offset="42%" stop-color="#ffd277"/>
      <stop offset="100%" stop-color="#ffd277" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tgold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe9b0"/><stop offset=".5" stop-color="#e7c46b"/><stop offset="1" stop-color="#c39a3c"/>
    </linearGradient>
    <radialGradient id="tmsun" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#ffeec2"/><stop offset="1" stop-color="#d9b45e"/>
    </radialGradient>
  </defs>

  <!-- scene -->
  <rect width="1600" height="900" fill="url(#tsky)"/>
  <circle cx="1180" cy="360" r="360" fill="url(#tsun)"/>
  <circle cx="1180" cy="360" r="120" fill="#fff0bf" opacity=".85"/>
  <path d="M0 560 q220 -52 440 -34 q260 22 520 -16 q320 -42 640 -10 V900 H0 Z" fill="#c46a3f"/>
  <g fill="#a8512c">
