<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6a6"/>
      <stop offset=".34" stop-color="#f6c65a"/>
      <stop offset=".62" stop-color="#ef9f4c"/>
      <stop offset="1" stop-color="#d9794f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36b0c6"/>
      <stop offset="1" stop-color="#1c89a0"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff4d2"/>
      <stop offset="45%" stop-color="#ffd277"/>
      <stop offset="100%" stop-color="#ffd277" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe9b0"/>
      <stop offset=".5" stop-color="#e7c46b"/>
      <stop offset="1" stop-color="#c39a3c"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1500" height="500" fill="url(#sky)"/>
  <!-- sun glow behind the wordmark -->
  <circle cx="750" cy="235" r="300" fill="url(#sun)"/>
  <circle cx="750" cy="235" r="120" fill="#ffe9b0" opacity=".85"/>

  <!-- distant hill with villas + palms (silhouette band) -->
  <g opacity=".92">
    <path d="M0 360 q120 -34 260 -22 q160 14 320 -10 q190 -28 360 -6 q180 22 360 -14 q120 -22 200 -8 V500 H0 Z" fill="#c46a3f"/>
    <g fill="#a8512c">
      <!-- villas: square + roof -->
      <g transform="translate(120,318)"><rect x="-13" y="0" width="26" height="30" /><path d="M-17 0 L0 -16 L17 0 Z"/></g>
      <g transform="translate(210,330)"><rect x="-11" y="0" width="22" height="26" /><path d="M-15 0 L0 -14 L15 0 Z"/></g>
      <g transform="translate(1170,330)"><rect x="-12" y="0" width="24" height="28" /><path d="M-16 0 L0 -15 L16 0 Z"/></g>
      <g transform="translate(1270,344)"><rect x="-10" y="0" width="20" height="24" /><path d="M-14 0 L0 -13 L14 0 Z"/></g>
      <g transform="translate(1360,330)"><rect x="-12" y="0" width="24" height="28" /><path d="M-16 0 L0 -15 L16 0 Z"/></g>
    </g>
    <!-- palms -->
    <g stroke="#9c4a28" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M300 360 q4 -26 0 -42"/><path d="M1080 360 q-4 -28 0 -44"/>
    </g>
    <g fill="#8c3f22">
      <g transform="translate(300,316)"><path d="M0 0 q-18 -10 -28 -2 q14 -2 28 2"/><path d="M0 0 q18 -10 28 -2 q-14 -2 -28 2"/><path d="M0 0 q-8 -18 -22 -20 q12 6 22 20"/><path d="M0 0 q8 -18 22 -20 q-12 6 -22 20"/></g>
      <g transform="translate(1080,314)"><path d="M0 0 q-18 -10 -28 -2 q14 -2 28 2"/><path d="M0 0 q18 -10 28 -2 q-14 -2 -28 2"/><path d="M0 0 q-8 -18 -22 -20 q12 6 22 20"/><path d="M0 0 q8 -18 22 -20 q-12 6 -22 20"/></g>
    </g>
  </g>

  <!-- sea -->
  <rect y="372" width="1500" height="128" fill="url(#sea)"/>
  <rect x="690" y="372" width="120" height="128" fill="#ffe5a6" opacity=".28"/>
  <g stroke="#dffaff" stroke-width="2.4" fill="none" opacity=".5" stroke-linecap="round">
    <path d="M120 410 q30 -10 60 0 t60 0 t60 0"/>
    <path d="M1080 432 q30 -10 60 0 t60 0 t60 0"/>
    <path d="M420 452 q30 -10 60 0 t60 0"/>
  </g>
  <!-- yacht silhouette -->
  <g transform="translate(980,398)" fill="#0f2930">
    <path d="M-46 8 L46 8 L34 26 L-36 26 Z"/>
    <rect x="-20" y="-8" width="40" height="16" rx="2"/>
    <rect x="-2" y="-30" width="3" height="24"/>
  </g>

  <!-- wordmark -->
  <text x="750" y="262" text-anchor="middle" font-size="118" letter-spacing="26" font-weight="600"
        fill="#fff7e6" style="paint-order:stroke" stroke="#7a3f23" stroke-width="2" stroke-opacity=".25">MAREA</text>
  <!-- hairline + diamond -->
  <line x1="560" y1="298" x2="700" y2="298" stroke="url(#gold)" stroke-width="2"/>
  <line x1="800" y1="298" x2="940" y2="298" stroke="url(#gold)" stroke-width="2"/>
  <path d="M750 290 l9 8 -9 8 -9 -8 z" fill="url(#gold)"/>
  <text x="750" y="330" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="21"
        letter-spacing="9" fill="#3a210f">A LUXURY HARBOR AT GOLDEN HOUR</text>

  <!-- footer tags -->
  <text x="750" y="470" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17"
        letter-spacing="6" fill="#fff7e6" opacity=".92">MULTIPLAYER · ON SOLANA · $RIV · PLAYMAREA.COM</text>
</svg>
