<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="gp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e2a4"/>
      <stop offset=".5" stop-color="#dcb863"/>
      <stop offset="1" stop-color="#b3892f"/>
    </linearGradient>
    <radialGradient id="sp" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#ffeec2"/>
      <stop offset="1" stop-color="#d9b45e"/>
    </radialGradient>
    <radialGradient id="bgp" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#16404a"/>
      <stop offset="1" stop-color="#0b2128"/>
    </radialGradient>
  </defs>

  <!-- full-bleed navy so the circular crop is always filled -->
  <rect x="0" y="0" width="1000" height="1000" fill="url(#bgp)"/>
  <!-- gold ring that matches the circular crop -->
  <circle cx="500" cy="500" r="468" fill="none" stroke="url(#gp)" stroke-width="9" opacity=".95"/>
  <circle cx="500" cy="500" r="452" fill="none" stroke="url(#gp)" stroke-width="2" opacity=".4"/>

  <!-- mark centered with comfortable margin from the ring -->
  <g transform="translate(500,508) scale(2.55) translate(-128,-127)">
    <circle cx="128" cy="78" r="23" fill="url(#sp)"/>
    <path d="M76 178 L76 104 L128 146 L180 104 L180 178"
          fill="none" stroke="url(#gp)" stroke-width="13"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M84 196 q11 -7 22 0 t22 0 t22 0 t22 0"
          fill="none" stroke="url(#gp)" stroke-width="4" stroke-linecap="round" opacity=".9"/>
  </g>
</svg>
