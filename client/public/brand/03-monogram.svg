<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" font-family="Georgia, serif">
  <defs>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e2a4"/>
      <stop offset=".5" stop-color="#d9b45e"/>
      <stop offset="1" stop-color="#b3892f"/>
    </linearGradient>
    <radialGradient id="s3" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe9b8"/>
      <stop offset="1" stop-color="#d9b45e"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#102a31"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="url(#g3)" stroke-width="2.5"/>

