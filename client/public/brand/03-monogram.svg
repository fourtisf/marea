<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e2a4"/>
      <stop offset=".5" stop-color="#dcb863"/>
      <stop offset="1" stop-color="#b3892f"/>
    </linearGradient>
    <radialGradient id="s3" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#ffeec2"/>
      <stop offset="1" stop-color="#d9b45e"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="#102a31"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="54.5" fill="none" stroke="url(#g3)" stroke-width="3"/>

  <!-- sun rising between the arms of the M -->
