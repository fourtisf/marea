<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="g5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b45e"/>
      <stop offset="1" stop-color="#b3892f"/>
    </linearGradient>
  </defs>
  <rect width="420" height="300" fill="#fbf4e2"/>

  <!-- thin ring emblem: setting sun + sea, all line work -->
  <g transform="translate(210,118)">
    <circle r="62" fill="none" stroke="url(#g5)" stroke-width="1.6"/>
    <line x1="-46" y1="6" x2="46" y2="6" stroke="url(#g5)" stroke-width="1.4"/>
    <!-- sun -->
    <circle cx="0" cy="-6" r="20" fill="none" stroke="url(#g5)" stroke-width="2"/>
    <g stroke="url(#g5)" stroke-width="1.6" stroke-linecap="round">
      <line x1="-30" y1="-6" x2="-26" y2="-6"/><line x1="26" y1="-6" x2="30" y2="-6"/>
      <line x1="0" y1="-32" x2="0" y2="-36"/>
      <line x1="-21" y1="-21" x2="-24" y2="-24"/><line x1="21" y1="-21" x2="24" y2="-24"/>
    </g>
    <!-- waves below the horizon line -->
    <g stroke="url(#g5)" stroke-width="1.6" fill="none" stroke-linecap="round">
      <path d="M-34 22 q8.5 -6 17 0 t17 0 t17 0"/>
      <path d="M-26 34 q8.5 -6 17 0 t17 0" opacity=".7"/>
    </g>
  </g>

  <text x="210" y="232" text-anchor="middle" font-size="46" letter-spacing="16" fill="#13343c" font-weight="600">MAREA</text>
  <text x="210" y="258" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" letter-spacing="7" fill="#3c5a61">MEDITERRANEAN HARBOR</text>
</svg>
