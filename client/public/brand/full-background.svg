  <g fill="#a8512c">
    <g transform="translate(180,628)"><rect x="-22" y="0" width="44" height="52"/><path d="M-28 0 L0 -28 L28 0 Z"/></g>
    <g transform="translate(330,656)"><rect x="-18" y="0" width="36" height="44"/><path d="M-24 0 L0 -24 L24 0 Z"/></g>
    <g transform="translate(470,640)"><rect x="-20" y="0" width="40" height="48"/><path d="M-26 0 L0 -26 L26 0 Z"/></g>
    <g transform="translate(1500,648)"><rect x="-20" y="0" width="40" height="48"/><path d="M-26 0 L0 -26 L26 0 Z"/></g>
    <g transform="translate(1660,672)"><rect x="-16" y="0" width="32" height="40"/><path d="M-22 0 L0 -22 L22 0 Z"/></g>
  </g>
  <g stroke="#9c4a28" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M620 700 q7 -46 0 -76"/><path d="M1300 706 q-7 -48 0 -80"/>
  </g>
  <g fill="#8c3f22">
    <g transform="translate(620,620)"><path d="M0 0 q-32 -18 -50 -4 q24 -4 50 4"/><path d="M0 0 q32 -18 50 -4 q-24 -4 -50 4"/><path d="M0 0 q-14 -32 -40 -36 q22 10 40 36"/><path d="M0 0 q14 -32 40 -36 q-22 10 -40 36"/></g>
    <g transform="translate(1300,622)"><path d="M0 0 q-32 -18 -50 -4 q24 -4 50 4"/><path d="M0 0 q32 -18 50 -4 q-24 -4 -50 4"/><path d="M0 0 q-14 -32 -40 -36 q22 10 40 36"/><path d="M0 0 q14 -32 40 -36 q-22 10 -40 36"/></g>
  </g>

  <!-- sea -->
  <rect y="712" width="1920" height="368" fill="url(#bsea)"/>
  <rect x="1200" y="712" width="180" height="368" fill="#ffe5a6" opacity=".26"/>
  <g stroke="#dffaff" stroke-width="3.4" fill="none" opacity=".5" stroke-linecap="round">
