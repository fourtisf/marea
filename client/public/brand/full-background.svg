<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9ad"/>
      <stop offset=".34" stop-color="#f8cb60"/>
      <stop offset=".60" stop-color="#f0a24d"/>
      <stop offset="1" stop-color="#dd8050"/>
    </linearGradient>
    <linearGradient id="bsea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39b2c8"/>
      <stop offset="1" stop-color="#19809a"/>
    </linearGradient>
    <radialGradient id="bsun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff5d4"/>
      <stop offset="42%" stop-color="#ffd277"/>
      <stop offset="100%" stop-color="#ffd277" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bsky)"/>

  <!-- sun -->
  <circle cx="1290" cy="430" r="430" fill="url(#bsun)"/>
  <circle cx="1290" cy="430" r="150" fill="#fff0bf" opacity=".9"/>

