<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="gif" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e2a4"/>
      <stop offset=".5" stop-color="#dcb863"/>
      <stop offset="1" stop-color="#b3892f"/>
    </linearGradient>
    <radialGradient id="sif" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#ffeec2"/>
      <stop offset="1" stop-color="#d9b45e"/>
    </radialGradient>
    <linearGradient id="bgif" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#143942"/>
      <stop offset="1" stop-color="#0c242b"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background (edge to edge, no transparency) -->
  <rect x="0" y="0" width="256" height="256" fill="url(#bgif)"/>
  <!-- thin inner gold frame -->
  <rect x="12" y="12" width="232" height="232" rx="30" fill="none" stroke="url(#gif)" stroke-width="3"/>

  <!-- mark, scaled up to fill more of the icon -->
  <g transform="translate(128,130) scale(1.16) translate(-128,-128)">
    <circle cx="128" cy="78" r="23" fill="url(#sif)"/>
    <path d="M76 178 L76 104 L128 146 L180 104 L180 178"
          fill="none" stroke="url(#gif)" stroke-width="13"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M84 196 q11 -7 22 0 t22 0 t22 0 t22 0"
          fill="none" stroke="url(#gif)" stroke-width="4" stroke-linecap="round" opacity=".9"/>
  </g>
</svg>
